networks:
  internal:

volumes:
  pgdata:
  storage:
  openobserve-data:
  landing-waitlist:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garde_manger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garde_manger}
      POSTGRES_DB: ${POSTGRES_DB:-garde_manger}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-garde_manger} -d ${POSTGRES_DB:-garde_manger}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/floriaaan/garde-manger-backend:main}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3333}
      # Required by start/env.ts since the LAN-URL change; it was missing here,
      # so the container failed env validation before it could serve anything.
      NETWORK_URL: ${NETWORK_URL:-http://localhost:3333}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-garde_manger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-garde_manger}
      DB_DATABASE: ${POSTGRES_DB:-garde_manger}
      # `exp://` lets Expo Go sign in, `gardemanger://` the installed app:
      # better-auth's expo plugin only trusts them by itself in development.
      CORS_ORIGIN: ${CORS_ORIGIN:-exp://,gardemanger://}
      POCKETID_ISSUER_URL: ${POCKETID_ISSUER_URL:-}
      POCKETID_CLIENT_ID: ${POCKETID_CLIENT_ID:-}
      POCKETID_CLIENT_SECRET: ${POCKETID_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISABLE_PASSWORD_LOGIN: ${DISABLE_PASSWORD_LOGIN:-false}
      # AI (receipt scan, recipes) — cf. docs/adr/0007. Unset keys simply
      # leave that provider out of the available list.
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-}
      # Receipt and product photos (cf. docs/adr/0009), on a volume so they
      # survive a rebuild.
      STORAGE_ROOT: /app/data/storage
      HOME_ASSISTANT_ALLOWED_HOSTS: ${HOME_ASSISTANT_ALLOWED_HOSTS:-}
      # Observability (cf. docs/adr/0011). On by default, and deliberately
      # *not* a `depends_on`: the API must start and serve with the collector
      # and the store absent, stopped or broken.
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: garde-manger-backend
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      APP_VERSION: ${APP_VERSION:-0.0.0}
      DEPLOY_ENV: ${DEPLOY_ENV:-homelab}
      TELEMETRY_INGEST_ENABLED: ${TELEMETRY_INGEST_ENABLED:-true}
      TELEMETRY_OTLP_ENDPOINT: ${TELEMETRY_OTLP_ENDPOINT:-http://otel-collector:4318}
      TELEMETRY_MAX_BODY_BYTES: ${TELEMETRY_MAX_BODY_BYTES:-262144}
      TELEMETRY_RATE_LIMIT_PER_MINUTE: ${TELEMETRY_RATE_LIMIT_PER_MINUTE:-60}
      PUBLIC_STATS_ENABLED: ${PUBLIC_STATS_ENABLED:-false}
      INSTANCE_MODE: ${INSTANCE_MODE:-self-hosted}
      INSTANCE_NAME: ${INSTANCE_NAME:-}
      AI_QUOTA_FREE: ${AI_QUOTA_FREE:-5}
      AI_QUOTA_SUBSCRIBED: ${AI_QUOTA_SUBSCRIBED:-150}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_RETURN_URL: ${STRIPE_RETURN_URL:-}
    depends_on:
      db:
        condition: service_healthy
    # Lets OLLAMA_BASE_URL point at an Ollama running on the host
    # (http://host.docker.internal:11434) on Linux too.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - storage:/app/data
    ports:
      - '${BACKEND_PORT:-3333}:3333'
    networks:
      - internal

  # Marketing site (landing/). Nothing depends on it and it depends on no
  # other service: its API/GitHub reads happen in the visitor's browser, so
  # the URLs below are baked in at build time and must be publicly
  # reachable. The waitlist signup is the one write it owns — a local
  # sqlite file on its own volume, not the app's Postgres.
  # Behind a profile: self-hosting the app doesn't need it
  # (`docker compose --profile landing up -d landing`).
  landing:
    profiles: [landing]
    image: ${LANDING_IMAGE:-ghcr.io/floriaaan/garde-manger-landing:main}
    restart: unless-stopped
    environment:
      WAITLIST_DB_PATH: /app/landing/data/waitlist.sqlite3
    volumes:
      - landing-waitlist:/app/landing/data
    ports:
      - '${LANDING_PORT:-3000}:3000'
    networks:
      - internal

  #--------------------------------------------------------------------
  # Observability — part of the default stack (cf. docs/adr/0011).
  #
  # Two containers, ~1.5 GB of RAM ceiling between them. Nothing above
  # depends on them: stop both and the app keeps serving, having lost only
  # its telemetry. To run without them:
  #   docker compose up -d db backend
  #--------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-homelab}
      OTLP_STORE_ENDPOINT: ${OTLP_STORE_ENDPOINT:-http://openobserve:5080/api/default}
      # base64("<email>:<password>") of the OpenObserve root user. The default
      # matches the default credentials below — change both together.
      OTLP_STORE_AUTH: ${OTLP_STORE_AUTH:-YWRtaW5AZnJpZGdlLmxvY2FsOkNvbXBsZXhwYXNzIzEyMw==}
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Loopback only. The collector has no authentication of its own, so it
      # is never published on a routable interface — mobile clients reach it
      # through the backend relay (POST /api/telemetry/v1/*), never directly.
      - '${OBSERVABILITY_BIND:-127.0.0.1}:4317:4317'
      - '${OBSERVABILITY_BIND:-127.0.0.1}:4318:4318'
    depends_on:
      - openobserve
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  openobserve:
    image: openobserve/openobserve:v0.92.2
    restart: unless-stopped
    environment:
      # Change these. They are defaulted so `task up` works out of the box on
      # a loopback-bound port, not because they are safe on a routable one.
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:-admin@garde-manger.local}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:-Complexpass#123}
      ZO_DATA_DIR: /data
      # Retention. Disk is the scarce resource in a homelab, not CPU.
      ZO_COMPACT_DATA_RETENTION_DAYS: ${OBSERVABILITY_RETENTION_DAYS:-30}
      ZO_TELEMETRY: 'false'
      ZO_MEMORY_CACHE_MAX_SIZE: ${OPENOBSERVE_CACHE_MB:-256}
    volumes:
      - openobserve-data:/data
    ports:
      # UI + ingestion API, loopback by default: put it behind the homelab's
      # own reverse proxy (with TLS) rather than exposing 5080 to the LAN.
      - '${OBSERVABILITY_BIND:-127.0.0.1}:5080:5080'
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G
