server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location = /push-sw.js {
        add_header Cache-Control "no-cache";
    }

    # A missing font must return 404 rather than the SPA HTML document.
    location /fonts/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
