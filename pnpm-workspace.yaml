packages:
  - backend
  - mobile
  - landing
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-x64': false
  # Same as linux-x64, for the arm64 variant pnpm resolves when the backend
  # image is built on Apple Silicon — without an entry, `pnpm install
  # --frozen-lockfile` fails the Docker build outright.
  '@embedded-postgres/linux-arm64': false
  '@google/genai': false
  '@swc/core': true
  esbuild: true
  protobufjs: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.19'
  - '@expo/inline-modules@0.1.7'
  - '@expo/local-build-cache-provider@57.0.8'
  - '@expo/log-box@57.0.4'
  - '@expo/metro-config@57.0.11'
  - '@expo/metro-runtime@57.0.14'
  - '@expo/prebuild-config@57.0.15'
  - '@expo/router-server@57.0.8'
  - '@expo/ui@57.0.14'
  - babel-preset-expo@57.0.9
  - expo-asset@57.0.15
  - expo-constants@57.0.15
  - expo-file-system@57.0.6
  - expo-linking@57.0.8
  - expo-modules-autolinking@57.0.12
  - expo-modules-core@57.0.14
  - expo-modules-jsi@57.0.6
  - expo-router@57.0.17
  - expo-secure-store@57.0.2
  - expo-system-ui@57.0.3
  - expo@57.0.17
  - eslint-config-expo@57.0.2
  - jest-expo@57.0.5
  - '@tanstack/query-core@5.103.0'
  - '@tanstack/react-query@5.103.0'
  - '@types/node@22.20.3'
  - react-i18next@17.0.16
