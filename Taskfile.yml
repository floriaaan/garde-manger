version: '3'

vars:
  BACKEND: garde-manger-backend
  MOBILE: garde-manger-mobile
  LANDING: garde-manger-landing
  # -f is explicit below, which turns off Compose's own compose.yaml +
  # compose.override.yaml auto-lookup — so re-add the override by hand
  # whenever it's there (cf. compose.override.yml.example).
  COMPOSE:
    sh: |
      if [ -f compose.override.yml ]; then
        echo "docker compose -f compose.yml -f compose.override.yml"
      else
        echo "docker compose -f compose.yml"
      fi

tasks:
  setup:
    desc: Install dependencies, copy .env files.
    cmds:
      - pnpm install
      - cmd: cp -n .env.example .env
        ignore_error: true
      - cmd: cp -n backend/.env.example backend/.env
        ignore_error: true
      - cmd: cp -n mobile/.env.example mobile/.env
        ignore_error: true
      - cmd: cp -n landing/.env.example landing/.env
        ignore_error: true

  env:sync:
    desc: Sync root .env (Docker Compose) from backend/.env (AdonisJS) for vars they share.
    cmds:
      - dev/sync-env.sh

  dev:
    desc: Run the backend dev server locally (HMR), Postgres in Docker.
    deps: [dev:db]
    cmds:
      - task: backend:dev

  dev:db:
    desc: Start only the Postgres container.
    cmds:
      # --wait: block until the healthcheck passes, not just until the
      # container starts — backend:dev connects right after this returns and
      # Postgres isn't ready to accept connections the instant it starts.
      - "{{.COMPOSE}} up -d --wait db"

  dev:tmux:
    desc: Open a tmux session with the full dev stack (backend, mobile, otel logs) plus a claude pane and a scratch bash pane.
    cmds:
      - dev/tmux-dev.sh

  backend:dev:
    desc: Run the backend dev server locally (HMR).
    dir: backend
    cmds:
      # `node ace serve` silently falls back to a random port when 3333 is
      # already held (cf. dev/kill-port.sh) — a leftover process from a
      # killed pane would otherwise start serving somewhere else with no
      # warning, and every client still pointed at :3333 just sees
      # "unreachable".
      - ../dev/kill-port.sh "${PORT:-3333}"
      - pnpm run dev

  stripe:listen:
    desc: Forward Stripe subscription webhooks to the local backend (needs the Stripe CLI; prints the STRIPE_WEBHOOK_SECRET to use).
    cmds:
      - stripe listen --events customer.subscription.created,customer.subscription.updated,customer.subscription.deleted --forward-to "localhost:${PORT:-3333}/api/webhooks/stripe"

  backend:migrate:
    desc: Run pending database migrations.
    dir: backend
    cmds:
      - node ace migration:run

  backend:rollback:
    desc: Roll back the last migration batch.
    dir: backend
    cmds:
      - node ace migration:rollback

  backend:reset:
    desc: Drop and re-migrate the database.
    dir: backend
    cmds:
      - node ace migration:fresh

  backend:test:
    desc: Run backend tests (Japa).
    dir: backend
    cmds:
      - pnpm run test

  backend:lint:
    desc: Lint the backend.
    cmds:
      - pnpm --filter {{.BACKEND}} run lint

  backend:format:
    desc: Format the backend.
    cmds:
      - pnpm --filter {{.BACKEND}} run format

  backend:typecheck:
    desc: Type-check the backend.
    cmds:
      - pnpm --filter {{.BACKEND}} run typecheck

  backend:boundaries:
    desc: Enforce the domain/application/infrastructure/presentation dependency rule.
    cmds:
      - pnpm --filter {{.BACKEND}} run boundaries

  backend:check:
    desc: Lint, typecheck, tests, boundaries — backend only.
    cmds:
      - task: backend:lint
      - task: backend:typecheck
      - task: backend:test
      - task: backend:boundaries

  mobile:dev:
    desc: Run the Expo dev server.
    dir: mobile
    cmds:
      - pnpm run start

  mobile:lint:
    desc: Lint the mobile app.
    cmds:
      - pnpm --filter {{.MOBILE}} run lint

  mobile:typecheck:
    desc: Typecheck the mobile app.
    cmds:
      - pnpm --filter {{.MOBILE}} run typecheck

  mobile:test:
    desc: Run mobile tests (Jest).
    dir: mobile
    cmds:
      - pnpm run test

  mobile:boundaries:
    desc: Lint the mobile app's dependency boundaries.
    cmds:
      - pnpm --filter {{.MOBILE}} run boundaries

  mobile:check:
    desc: Lint, typecheck, tests, boundaries — mobile only.
    cmds:
      - task: mobile:lint
      - task: mobile:typecheck
      # - task: mobile:test - Disabled for now - cause : When testing, code that causes React state updates should be wrapped into act(...):
      - task: mobile:boundaries

  landing:dev:
    desc: Run the landing site dev server (http://localhost:3000).
    dir: landing
    cmds:
      - pnpm run dev

  landing:typecheck:
    desc: Typecheck the landing site.
    cmds:
      - pnpm --filter {{.LANDING}} run typecheck

  landing:test:
    desc: Run landing tests (Vitest).
    cmds:
      - pnpm --filter {{.LANDING}} run test

  landing:boundaries:
    desc: Lint the landing site's dependency boundaries.
    cmds:
      - pnpm --filter {{.LANDING}} run boundaries

  landing:check:
    desc: Typecheck, tests, boundaries — landing only (no lint script yet).
    cmds:
      - task: landing:typecheck
      - task: landing:test
      - task: landing:boundaries

  check:
    desc: The CI command — lint + typecheck + tests + boundary lint, every package.
    cmds:
      - task: backend:check
      - task: mobile:check
      - task: landing:check

  build:
    desc: Build the backend.
    cmds:
      - pnpm --filter {{.BACKEND}} run build

  up:
    desc: Start the production-like stack.
    cmds:
      - "{{.COMPOSE}} pull && {{.COMPOSE}} up -d"

  down:
    desc: Stop the stack.
    cmds:
      - "{{.COMPOSE}} down"

  logs:
    desc: Tail logs for the whole stack.
    cmds:
      - "{{.COMPOSE}} logs -f"

  up:app-only:
    desc: Start the app without the observability stack (db + backend only).
    cmds:
      - "{{.COMPOSE}} pull db backend && {{.COMPOSE}} up -d db backend"

  obs:down:
    desc: Stop the observability stack, leaving the app running.
    cmds:
      - "{{.COMPOSE}} stop otel-collector openobserve"

  obs:logs:
    desc: Tail the collector's logs — where a rejected or misrouted export shows up.
    cmds:
      - "{{.COMPOSE}} logs -f otel-collector"
